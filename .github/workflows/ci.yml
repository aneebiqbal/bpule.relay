name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm build

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # No AI provider keys or Supabase env are set here on purpose — the
      # regression suite exercises the deterministic demo/no-provider code
      # paths (demoExtract, demoDraft, runEval against local fixtures), so
      # it needs no live credentials and makes no network calls.
      - run: pnpm test

  # Runs only when a migration file actually changes, so tenant isolation is
  # re-verified automatically on the change most likely to break it, instead
  # of depending on someone remembering to run this by hand.
  rls-adversarial:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for migration changes
        id: migration-check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE" HEAD -- supabase/migrations | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.migration-check.outputs.changed == 'true'

      - uses: actions/setup-node@v4
        if: steps.migration-check.outputs.changed == 'true'
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        if: steps.migration-check.outputs.changed == 'true'

      # Requires a real Supabase project's credentials, configured as repo
      # secrets: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
      # SUPABASE_SERVICE_ROLE_KEY. Runs against a real project, not a mock —
      # this only proves anything against the actual RLS policies. When the
      # secrets are absent the check is skipped (with a notice) rather than
      # failing, so a missing secret never blocks an unrelated PR.
      - name: Check Supabase secrets
        id: secrets-check
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] \
            && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] \
            && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Two-organization adversarial RLS test
        if: steps.migration-check.outputs.changed == 'true' && steps.secrets-check.outputs.present == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/rls-multitenant.mjs

      - name: RLS test skipped — Supabase secrets not configured
        if: steps.migration-check.outputs.changed == 'true' && steps.secrets-check.outputs.present != 'true'
        run: |
          echo "::notice::Skipping the adversarial RLS test: Supabase secrets are not configured on this repository."

  # Release gate. A green badge requires the product contracts to pass with no
  # skipped test, the historical regression corpus to pass, lead parity to hold,
  # and typecheck / lint / tests / build to be green. No release is green when a
  # contract test skipped.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Contract coverage (no skips allowed)
        run: pnpm qa:coverage

      - name: Historical regression corpus
        run: pnpm exec vitest run tests/relay-regression-corpus.test.ts --silent

      - name: Contract owner scan
        run: pnpm exec vitest run tests/relay-contract-owners.test.ts --silent

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit / integration
        run: pnpm test

      - name: Build
        run: pnpm build

