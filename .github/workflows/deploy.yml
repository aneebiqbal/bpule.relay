
name: Deploy Relay

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Retrieve build environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp deploy@"$VPS_HOST":/home/deploy/apps/relay/.env.production .env.production
          chmod 600 .env.production

      - name: Install and build on GitHub
        env:
          RELAY_GIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f .next/standalone/server.js

      - name: Package application
        run: |
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/
          cp -a public .next/standalone/

          # Never ship the copied build environment
          find .next/standalone -name '.env*' -type f -delete

          tar -czf /tmp/relay-release.tar.gz \
            -C .next/standalone .

          rm -f .env.production

      - name: Package operations assets
        run: |
          # Migrations, the migration runner and the systemd units must ship
          # with the release: a standalone build alone cannot apply schema or
          # start the scheduled workers.
          tar -czf /tmp/relay-ops.tar.gz \
            supabase/migrations scripts/apply-migrations.mjs deploy

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh deploy@"$VPS_HOST" \
            "mkdir -p /home/deploy/apps/relay-releases/$GITHUB_SHA"

          scp /tmp/relay-release.tar.gz \
            deploy@"$VPS_HOST":/home/deploy/apps/relay-releases/"$GITHUB_SHA"/release.tar.gz

          scp /tmp/relay-ops.tar.gz \
            deploy@"$VPS_HOST":/home/deploy/apps/relay-releases/"$GITHUB_SHA"/ops.tar.gz

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          # Owner-level DDL connection for schema migrations. The app/service
          # roles are DML-only; without this the migration step fails closed.
          RELAY_DDL_DATABASE_URL: ${{ secrets.RELAY_DDL_DATABASE_URL }}
        run: |
          ssh deploy@"$VPS_HOST" bash -s -- "$GITHUB_SHA" "${RELAY_DDL_DATABASE_URL:-}" <<'REMOTE'
          set -euo pipefail

          SHA="$1"
          DDL_URL="${2:-}"
          BASE=/home/deploy/apps
          RELEASE="$BASE/relay-releases/$SHA"
          CURRENT="$BASE/relay-current"

          cd "$RELEASE"
          tar -xzf release.tar.gz
          rm release.tar.gz
          tar -xzf ops.tar.gz
          rm ops.tar.gz

          # -sfn: a re-run of the same SHA finds the previous run's symlink.
          ln -sfn "$BASE/relay/.env.production" \
            "$RELEASE/.env.production"

          # Schema first: the new build must never serve against an old schema.
          set -a
          . .env.production
          set +a
          # Prefer the CI-provided owner connection; fall back to an owner-level
          # DSN stored in the VPS environment under a conventional name. Values
          # are never printed.
          DDL_URL="${DDL_URL:-${RELAY_DDL_DATABASE_URL:-}}"
          if [ -z "$DDL_URL" ] && [ -f "$BASE/relay/.env.ddl" ]; then
            set -a
            . "$BASE/relay/.env.ddl"
            set +a
          fi
          if [ -z "$DDL_URL" ]; then
            for candidate in MIGRATION_DATABASE_URL DDL_DATABASE_URL OWNER_DATABASE_URL AVNADMIN_DATABASE_URL ADMIN_DATABASE_URL; do
              eval "value=\${$candidate:-}"
              if [ -n "$value" ]; then
                DDL_URL="$value"
                echo "DDL credential discovered from $candidate"
                break
              fi
            done
          fi
          if [ -z "$DDL_URL" ]; then
            echo "RELAY_DDL_DATABASE_URL was not provided; refusing schema changes." >&2
            exit 1
          fi
          export RELAY_DDL_DATABASE_URL="$DDL_URL"
          node scripts/apply-migrations.mjs

          # Scheduled workers (discovery / verification / inventory /
          # preparation / notifications). Guarded: a missing passwordless sudo
          # must not fail the deployment.
          if sudo -n true 2>/dev/null; then
            sudo bash deploy/install-job-discovery.sh || echo "job timer install failed"
          else
            echo "passwordless sudo unavailable; install deploy/install-job-discovery.sh manually"
          fi

          ln -sfn "$RELEASE" "$BASE/relay-next"
          mv -Tf "$BASE/relay-next" "$CURRENT"

          pm2 delete relay || true

          cd "$CURRENT"
          HOSTNAME=127.0.0.1 PORT=3000 \
          RELAY_GIT_SHA="$SHA" \
            pm2 start server.js --name relay

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/login \
                -o /dev/null; then
              pm2 save
              exit 0
            fi
            sleep 2
          done

          echo "Relay health check failed"
          echo "--- pm2 status ---"
          pm2 list || true
          echo "--- pm2 logs ---"
          pm2 logs relay --lines 80 --nostream || true
          echo "--- curl probe ---"
          curl -v http://127.0.0.1:3000/login 2>&1 | tail -20 || true
          echo "--- port probe ---"
          (ss -ltnp 2>/dev/null | grep ':3000' || true)
          exit 1
          REMOTE
